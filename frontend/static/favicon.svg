<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Background rounded rect -->
  <rect width="48" height="48" rx="10" fill="#006B3C"/>
  <!-- Bus roof / top strip -->
  <rect x="9" y="9" width="30" height="7" rx="3" fill="white" opacity="0.85"/>
  <!-- Bus body -->
  <rect x="9" y="15" width="30" height="19" rx="3" fill="white"/>
  <!-- Windows -->
  <rect x="12" y="18" width="10" height="8" rx="2" fill="#006B3C"/>
  <rect x="26" y="18" width="10" height="8" rx="2" fill="#006B3C"/>
  <!-- Underbody / bumper -->
  <rect x="9" y="33" width="30" height="4" rx="1" fill="white" opacity="0.5"/>
  <!-- Wheels -->
  <circle cx="15" cy="40" r="4.5" fill="#1c1b1b"/>
  <circle cx="15" cy="40" r="2"   fill="#e8f5ee"/>
  <circle cx="33" cy="40" r="4.5" fill="#1c1b1b"/>
  <circle cx="33" cy="40" r="2"   fill="#e8f5ee"/>
</svg>
